name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: swift test
      - name: Build universal app
        run: make app
      - name: Check architectures
        run: |
          archs=$(lipo -archs .build/CopyBar.app/Contents/MacOS/CopyBar)
          echo "$archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
      - name: Package
        run: ditto -c -k --keepParent .build/CopyBar.app CopyBar.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CopyBar
          path: CopyBar.zip

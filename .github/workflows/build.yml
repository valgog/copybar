name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: swift test
      - name: Build universal app
        run: make app
      - name: Check architectures
        run: |
          archs=$(lipo -archs .build/CopyBar.app/Contents/MacOS/CopyBar)
          echo "$archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
      - name: Diagnose login item flag detection
        run: |
          set +e
          bin=.build/CopyBar.app/Contents/MacOS/CopyBar
          grep --version || true
          locale
          grep -qa -- --unregister-login-item "$bin"; echo "plain grep: $?"
          LC_ALL=C grep -qa -- --unregister-login-item "$bin"; echo "C grep: $?"
          LC_ALL=C grep -qaF -- --unregister-login-item "$bin"; echo "C grep -F: $?"
          strings -a "$bin" | grep -n -- unregister || echo "strings: no match"
          strings -a "$bin" | grep -n -- 'login-item' || true
          "$bin" --unregister-login-item; echo "flag exit: $?"
      - name: Package
        run: ditto -c -k --keepParent .build/CopyBar.app CopyBar.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CopyBar
          path: CopyBar.zip
